[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ackermann-nn-fuzzy-pid"
version = "0.1.0"
description = "Reproducible simulation code for NN-supervised Fuzzy-PID steering control of Ackermann vehicles"
authors = [{name = "Vo Thanh Ha"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]
